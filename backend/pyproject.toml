[project]
name = "sleepy-backend"
version = "0.1.0"
description = "Sleeby FAQ 챗봇 백엔드 (FastAPI + RAG 모듈)"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.12",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pyjwt>=2.15.1",
    "openai>=3.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
