[project]
name = "sleepy-backend"
version = "0.1.0"
description = "Sleeby FAQ 챗봇 백엔드 (RAG 모듈)"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
