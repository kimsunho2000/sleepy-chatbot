<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">슬리비 챗봇 시스템 구성</title>
  <desc id="desc">고객과 담당자는 Vercel에 올린 화면을 쓰고, 화면은 Cloud Run의 FastAPI 백엔드를 부른다. 백엔드의 Service는 Repository로 Supabase PostgreSQL에 기록하고, RAG 모듈로 Qdrant Cloud를 검색한 뒤 OpenAI로 답변을 만든다. FAQ가 바뀌면 로컬에서 인덱서를 실행해 Qdrant 색인을 다시 만든다.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .core { fill: #eef4ff; stroke: #8fb3f0; stroke-width: 1.2; }
    .group { fill: none; stroke: #8fb3f0; stroke-width: 1.4; }
    .lane { fill: none; stroke: #afb8c1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.4; }
    .head { fill: #57606a; }
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11.5px; }
    .h { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
    .g { fill: #2f6fdb; font-size: 12.5px; font-weight: 600; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .core { fill: #13233f; stroke: #3b6fc4; }
      .group { stroke: #3b6fc4; }
      .lane { stroke: #545d68; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .t { fill: #f0f6fc; }
      .s, .h { fill: #9198a1; }
      .g { fill: #6ea2f5; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="560" rx="12"/>

  <!-- 열 제목 -->
  <text class="h" x="100" y="52" text-anchor="middle">사용자</text>
  <text class="h" x="325" y="52" text-anchor="middle">화면 · Vercel</text>
  <text class="h" x="600" y="52" text-anchor="middle">백엔드 · Google Cloud Run</text>
  <text class="h" x="860" y="52" text-anchor="middle">데이터 · 외부 서비스</text>

  <!-- 사용자 -->
  <rect class="box" x="20" y="80" width="160" height="60" rx="8"/>
  <text class="t" x="100" y="106" text-anchor="middle">고객</text>
  <text class="s" x="100" y="125" text-anchor="middle">홈페이지 방문자</text>
  <rect class="box" x="20" y="180" width="160" height="60" rx="8"/>
  <text class="t" x="100" y="206" text-anchor="middle">담당자</text>
  <text class="s" x="100" y="225" text-anchor="middle">문의·답변 품질 관리</text>

  <!-- 화면 -->
  <rect class="box" x="230" y="80" width="190" height="60" rx="8"/>
  <text class="t" x="325" y="106" text-anchor="middle">고객 챗봇 화면</text>
  <text class="s" x="325" y="125" text-anchor="middle">frontend/ · React</text>
  <rect class="box" x="230" y="180" width="190" height="60" rx="8"/>
  <text class="t" x="325" y="206" text-anchor="middle">관리자 화면</text>
  <text class="s" x="325" y="225" text-anchor="middle">admin/ · React · 로그인</text>

  <!-- 백엔드 컨테이너 -->
  <rect class="group" x="470" y="70" width="260" height="330" rx="12"/>
  <text class="g" x="600" y="92" text-anchor="middle">FastAPI 컨테이너</text>

  <rect class="core" x="505" y="105" width="205" height="45" rx="8"/>
  <text class="t" x="607" y="124" text-anchor="middle">API Router</text>
  <text class="s" x="607" y="141" text-anchor="middle">요청·응답 검증, 인증</text>

  <rect class="core" x="505" y="175" width="205" height="50" rx="8"/>
  <text class="t" x="607" y="196" text-anchor="middle">Service</text>
  <text class="s" x="607" y="214" text-anchor="middle">대화 흐름 · 문의 유도 · 요청 제한</text>

  <rect class="core" x="505" y="250" width="205" height="45" rx="8"/>
  <text class="t" x="607" y="269" text-anchor="middle">Repository</text>
  <text class="s" x="607" y="286" text-anchor="middle">대화·문의·로그 저장</text>

  <rect class="core" x="505" y="320" width="205" height="65" rx="8"/>
  <text class="t" x="607" y="340" text-anchor="middle">RAG 모듈</text>
  <text class="s" x="607" y="358" text-anchor="middle">검색: 임베딩 7 + 키워드 1</text>
  <text class="s" x="607" y="374" text-anchor="middle">판단·답변 생성: LLM 1회</text>

  <!-- 데이터·외부 서비스 -->
  <rect class="box" x="780" y="245" width="160" height="55" rx="8"/>
  <text class="t" x="860" y="268" text-anchor="middle">Supabase</text>
  <text class="s" x="860" y="286" text-anchor="middle">PostgreSQL · 업무 DB</text>

  <rect class="box" x="780" y="310" width="160" height="45" rx="8"/>
  <text class="t" x="860" y="329" text-anchor="middle">OpenAI API</text>
  <text class="s" x="860" y="346" text-anchor="middle">임베딩 · GPT</text>

  <rect class="box" x="780" y="370" width="160" height="55" rx="8"/>
  <text class="t" x="860" y="393" text-anchor="middle">Qdrant Cloud</text>
  <text class="s" x="860" y="411" text-anchor="middle">FAQ·제품 벡터 색인</text>

  <!-- 요청 흐름 -->
  <path class="line" d="M180,110 L230,110" marker-end="url(#arrow)"/>
  <path class="line" d="M180,210 L230,210" marker-end="url(#arrow)"/>
  <path class="line" d="M420,110 L505,120" marker-end="url(#arrow)"/>
  <path class="line" d="M420,210 L505,135" marker-end="url(#arrow)"/>
  <path class="line" d="M607,150 L607,175" marker-end="url(#arrow)"/>
  <path class="line" d="M607,225 L607,250" marker-end="url(#arrow)"/>
  <path class="line" d="M505,205 L487,205 L487,352 L505,352" marker-end="url(#arrow)"/>
  <path class="line" d="M710,272 L780,272" marker-end="url(#arrow)"/>
  <path class="line" d="M710,335 L780,332" marker-end="url(#arrow)"/>
  <path class="line" d="M710,372 L780,392" marker-end="url(#arrow)"/>

  <!-- 색인 흐름 -->
  <rect class="lane" x="215" y="445" width="740" height="100" rx="10"/>
  <text class="h" x="230" y="465">색인 · FAQ가 바뀔 때 로컬에서 실행</text>
  <rect class="box" x="230" y="478" width="190" height="55" rx="8"/>
  <text class="t" x="325" y="501" text-anchor="middle">data/</text>
  <text class="s" x="325" y="519" text-anchor="middle">faq.json · product.json</text>
  <rect class="box" x="505" y="478" width="205" height="55" rx="8"/>
  <text class="t" x="607" y="501" text-anchor="middle">rag.indexer</text>
  <text class="s" x="607" y="519" text-anchor="middle">OpenAI 임베딩으로 벡터 생성</text>
  <path class="line" d="M420,505 L505,505" marker-end="url(#arrow)"/>
  <path class="line" d="M710,505 L860,505 L860,425" marker-end="url(#arrow)"/>
</svg>
